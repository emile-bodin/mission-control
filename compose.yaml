services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-3100}:3000"
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in .env}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?Set TRUSTED_PROXY_CIDRS in .env}
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bodin}:${POSTGRES_PASSWORD:-replace-with-local-password}@db:5432/${POSTGRES_DB:-bodin}
      GOOGLE_CALENDAR_ICS_URL: ${GOOGLE_CALENDAR_ICS_URL:-}
      PULSE_BASE_URL: ${PULSE_BASE_URL:-}
      PULSE_API_TOKEN: ${PULSE_API_TOKEN:-}
      DEVICE_TOKEN_PEPPER: ${DEVICE_TOKEN_PEPPER:?Set DEVICE_TOKEN_PEPPER in .env}
      DEVICE_ADMIN_TOKEN: ${DEVICE_ADMIN_TOKEN:?Set DEVICE_ADMIN_TOKEN in .env}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bodin}
      POSTGRES_USER: ${POSTGRES_USER:-bodin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-local-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  codex:
    profiles: ["codex"]
    build:
      context: ./codex
      args:
        CODEX_VERSION: ${CODEX_VERSION:-0.149.1}
    environment:
      CODEX_HOME: /home/codex/.codex
      HOME: /home/codex
      CODEX_AUTH_TIMEOUT_MS: ${CODEX_AUTH_TIMEOUT_MS:-5000}
    ports:
      - "${CODEX_STATUS_BIND:-127.0.0.1}:${CODEX_STATUS_PORT:-8081}:8080"
    volumes:
      - codex_auth:/home/codex/.codex
    networks:
      - codex_egress
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    init: true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "/app/status-server.mjs", "--check"]
      interval: 30s
      timeout: 10s
      retries: 2
      start_period: 5s

volumes:
  postgres_data:
  codex_auth:

networks:
  codex_egress:
